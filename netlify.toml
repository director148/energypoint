[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/people"
to = "/meet-the-team/"
status = 301

[[redirects]]
from = "/people/"
to = "/meet-the-team/"
status = 301

[[redirects]]
from = "/about-us"
to = "/meet-the-team/"
status = 301

[[redirects]]
from = "/about-us/"
to = "/meet-the-team/"
status = 301

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*"

[headers.values]
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

